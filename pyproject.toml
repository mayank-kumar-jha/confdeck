[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confdeck"
version = "0.1.0"
description = "An offline control desk for meeting-room cameras, displays and ceiling microphones"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "websockets==15.0.1",
  "httpx==0.28.1", "pydantic==2.14.1", "PyYAML==6.0.3", "psutil==7.2.2",
  "numpy>=1.26,<3",
  "qrcode==8.2", "pillow>=10,<14", "screeninfo==0.8.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build", "pip-licenses"]

[project.scripts]
confdeck = "confdeck.cli:main"

[tool.setuptools.packages.find]
include = ["confdeck*"]

[tool.setuptools.package-data]
confdeck = ["static/*", "static/vendor/*", "protocols/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires bundled MediaMTX and FFmpeg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
